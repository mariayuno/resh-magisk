name: Build

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Termux aarch64 packages
        run: |
          set -e
          REPO="https://packages.termux.dev/apt/termux-main"
          ARCH="aarch64"
          TMP="$(mktemp -d)"
          BIN="files/bin"
          mkdir -p "$BIN"

          echo "→ fetching package index"
          curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages.xz" | xz -d > "$TMP/Packages" \
          || curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages.gz" | gunzip > "$TMP/Packages" \
          || curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages" > "$TMP/Packages"
          echo "  index: $(wc -l < "$TMP/Packages") lines"

          get_bin() {
            local pkg="$1" bin="$2"
            echo "→ $pkg"
            local fname
            fname=$(awk "/^Package: $pkg$/{f=1} f&&/^Filename:/{print \$2;exit}" "$TMP/Packages")
            [ -z "$fname" ] && { echo "  SKIP: not in index"; return; }
            curl -sfL "$REPO/$fname" -o "$TMP/$pkg.deb"
            dpkg-deb -x "$TMP/$pkg.deb" "$TMP/$pkg"
            local found
            found=$(find "$TMP/$pkg" -name "$bin" -type f | head -1)
            [ -z "$found" ] && { echo "  SKIP: $bin not in deb"; return; }
            cp "$found" "$BIN/$bin"
            chmod 755 "$BIN/$bin"
            echo "  ✓ $(ls -lh "$BIN/$bin" | awk '{print $5}')"
          }

          get_bin zsh     zsh
          get_bin eza     eza
          get_bin bat     bat
          get_bin fzf     fzf
          get_bin ripgrep rg
          get_bin git     git
          get_bin openssh ssh

      - name: Clone oh-my-zsh + plugins
        run: |
          OMZ="files/oh-my-zsh"
          git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$OMZ"
          git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$OMZ/custom/themes/powerlevel10k"
          git clone --depth=1 https://github.com/zsh-users/zsh-autosuggestions "$OMZ/custom/plugins/zsh-autosuggestions"
          git clone --depth=1 https://github.com/zsh-users/zsh-syntax-highlighting "$OMZ/custom/plugins/zsh-syntax-highlighting"
          git clone --depth=1 https://github.com/agkozak/zsh-z "$OMZ/custom/plugins/z"
          find "$OMZ" -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: List bins
        run: ls -lh files/bin/

      - name: Package
        run: |
          VERSION="$(date +%Y%m%d)"
          sed -i "s/^version=.*/version=v$VERSION/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VERSION/" module.prop
          zip -r "rexshell-$VERSION.zip" META-INF module.prop files --exclude "*.git*" "*.github*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexshell
          path: "*.zip"

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-$(date +%Y%m%d)"
          name: "rexshell $(date +%Y-%m-%d)"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
