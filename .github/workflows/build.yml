name: Build

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "tag=build-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch Termux aarch64 packages + bundle lib deps
        run: |
          set -e
          REPO="https://packages.termux.dev/apt/termux-main"
          ARCH="aarch64"
          TMP="$(mktemp -d)"
          BIN="files/bin"
          LIB="files/lib"
          mkdir -p "$BIN" "$LIB"

          echo "→ fetching package index"
          curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages.xz" | xz -d > "$TMP/Packages" \
          || curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages.gz" | gunzip > "$TMP/Packages" \
          || curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages" > "$TMP/Packages"
          echo "  index: $(wc -l < "$TMP/Packages") lines"

          # Download + extract one binary from a Termux deb
          get_bin() {
            local pkg="$1" bin="$2"
            echo "→ $pkg"
            local fname
            fname=$(awk "/^Package: $pkg$/{f=1} f&&/^Filename:/{print \$2;exit}" "$TMP/Packages")
            [ -z "$fname" ] && { echo "  SKIP: not in index"; return; }
            curl -sfL "$REPO/$fname" -o "$TMP/$pkg.deb"
            dpkg-deb -x "$TMP/$pkg.deb" "$TMP/$pkg"
            local found
            found=$(find "$TMP/$pkg" -name "$bin" -type f | xargs -I{} sh -c 'file {} | grep -q ELF && echo {}' | head -1)
            [ -z "$found" ] && { echo "  SKIP: $bin not in deb"; return; }
            cp "$found" "$BIN/$bin"
            chmod 755 "$BIN/$bin"
            echo "  ✓ $(ls -lh "$BIN/$bin" | awk '{print $5}')"
          }

          # Core shell tools only — no git/openssh (heavy Termux runtime deps)
          get_bin zsh     zsh
          get_bin eza     eza
          get_bin bat     bat
          get_bin fzf     fzf
          get_bin ripgrep rg

          # Android system libs we don't need to bundle (always present on-device)
          SYSTEM_LIBS="libc.so libm.so libdl.so libz.so libstdc++.so liblog.so libandroid.so libc++.so libgcc_s.so libgcc.so"

          echo "→ bundling shared library deps"
          for binpath in "$BIN"/*; do
            bin="$(basename "$binpath")"
            readelf -d "$binpath" 2>/dev/null \
              | grep -oP '(?<=\[)[^\]]+\.so[^\]]*(?=\])' \
              | while read -r lib; do
                  echo "$SYSTEM_LIBS" | grep -qw "$lib" && continue
                  [ -f "$LIB/$lib" ] && continue   # already bundled
                  found=$(find "$TMP" -name "$lib" -path "*/usr/lib/*" | head -1)
                  if [ -n "$found" ]; then
                    cp "$found" "$LIB/$lib"
                    echo "  ✓ $bin → $lib"
                  else
                    echo "  ⚠ $bin needs $lib (not found in extracted debs)"
                  fi
                done
          done
          echo "  libs bundled: $(ls "$LIB" | wc -l)"

      - name: Clone oh-my-zsh + plugins
        run: |
          OMZ="files/oh-my-zsh"
          git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$OMZ"
          git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$OMZ/custom/themes/powerlevel10k"
          git clone --depth=1 https://github.com/zsh-users/zsh-autosuggestions "$OMZ/custom/plugins/zsh-autosuggestions"
          git clone --depth=1 https://github.com/zsh-users/zsh-syntax-highlighting "$OMZ/custom/plugins/zsh-syntax-highlighting"
          git clone --depth=1 https://github.com/agkozak/zsh-z "$OMZ/custom/plugins/z"
          find "$OMZ" -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          sed -i "s/^version=.*/version=$VERSION/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$(date +%Y%m%d)/" module.prop
          zip -r "rexshell-$(date +%Y%m%d).zip" \
            META-INF module.prop customize.sh service.sh files system \
            --exclude "*.git*" "*.github*"
          ls -lh *.zip
          echo "--- contents ---"
          unzip -l "rexshell-$(date +%Y%m%d).zip" | tail -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexshell
          path: "*.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: rexshell ${{ steps.version.outputs.tag }}
          files: "*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
