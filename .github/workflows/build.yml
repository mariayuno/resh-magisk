name: Build

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "tag=build-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Fetch Termux packages + bundle libs
        run: |
          set -euo pipefail
          REPO="https://packages.termux.dev/apt/termux-main"
          ARCH="aarch64"
          TMP="$(mktemp -d)"
          BIN="files/bin"
          LIB="files/lib"
          mkdir -p "$BIN" "$LIB" "$TMP/pkgs"

          # ════════════════════════════════════════════════════════════════
          # ADD PACKAGES HERE — just the Termux package name, one per line.
          # Transitive deps and their .so files are resolved automatically.
          # ════════════════════════════════════════════════════════════════
          PKGS="zsh eza bat fzf ripgrep git openssh"

          # Binary name when it differs from the package name
          BIN_OVERRIDES="ripgrep=rg openssh=ssh"
          # ════════════════════════════════════════════════════════════════

          echo "→ fetching package index"
          curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages.xz" | xz -d > "$TMP/Packages" \
          || curl -sfL "$REPO/dists/stable/main/binary-$ARCH/Packages.gz" | gunzip > "$TMP/Packages"
          echo "  $(wc -l < "$TMP/Packages") lines"

          fetch_pkg() {
            local pkg="$1"
            [ -d "$TMP/pkgs/$pkg" ] && return 0
            local fname
            fname=$(awk "/^Package: ${pkg}$/{f=1} f&&/^Filename:/{print \$2;exit}" "$TMP/Packages")
            [ -z "$fname" ] && { echo "  ⚠ $pkg not in index"; return 1; }
            curl -sfL "$REPO/$fname" -o "$TMP/pkgs/$pkg.deb"
            dpkg-deb -x "$TMP/pkgs/$pkg.deb" "$TMP/pkgs/$pkg"
          }

          resolve_deps() {
            local queue="$1" resolved=""
            while [ -n "$queue" ]; do
              local pkg; pkg=$(echo "$queue" | awk '{print $1}')
              queue=$(echo "$queue" | cut -d' ' -f2-)
              [ "$queue" = "$pkg" ] && queue=""
              echo " $resolved " | grep -q " $pkg " && continue || true
              resolved="$resolved $pkg"
              local deps
              deps=$(awk "
                /^Package: ${pkg}$/ { f=1 }
                f && /^Depends:/    { gsub(/^Depends: /,\"\"); print; f=0 }
                f && /^$/           { f=0 }
              " "$TMP/Packages" \
                | tr ',' '\n' | sed 's/|[^,]*//' | sed 's/ (.*//' \
                | tr -d ' ' | grep -v '^$' || true)
              for dep in $deps; do
                echo " $resolved $queue " | grep -q " $dep " || queue="$queue $dep" || true
              done
            done
            echo "$resolved"
          }

          echo "→ resolving deps"
          ALL=$(resolve_deps "$PKGS")
          echo "  direct=$(echo $PKGS | wc -w) total=$(echo $ALL | wc -w)"

          echo "→ downloading"
          for pkg in $ALL; do
            fetch_pkg "$pkg" && echo "  ✓ $pkg" || true
          done

          echo "→ extracting binaries"
          for pkg in $PKGS; do
            bin="$pkg"
            for o in $BIN_OVERRIDES; do
              [ "${o%%=*}" = "$pkg" ] && bin="${o##*=}"
            done
            [ -d "$TMP/pkgs/$pkg" ] || { echo "  ⚠ skipping $pkg (not downloaded)"; continue; }
            # xargs exits 123 when any sub-shell returns non-zero (grep -q on non-ELF files).
            # With pipefail that aborts the script. Use find+while instead, no xargs.
            found=""
            while IFS= read -r f; do
              file "$f" | grep -q ELF && found="$f" && break || true
            done < <(find "$TMP/pkgs/$pkg" -name "$bin" -type f)
            [ -z "$found" ] && { echo "  ⚠ $bin not found in $pkg"; continue; }
            cp "$found" "$BIN/$bin" && chmod 755 "$BIN/$bin"
            echo "  ✓ $bin ($(du -sh "$BIN/$bin" | cut -f1))"
          done

          echo "→ bundling zsh function files (compinit, add-zsh-hook, is-at-least, …)"
          ZSH_SHARE=$(find "$TMP/pkgs/zsh" -type d -name "functions" | head -1)
          if [ -n "$ZSH_SHARE" ]; then
            mkdir -p files/share/zsh
            cp -r "$ZSH_SHARE" files/share/zsh/functions
            echo "  $(ls files/share/zsh/functions | wc -l) zsh functions bundled"
          else
            echo "  ⚠ zsh function dir not found in package — completions will break"
          fi

          echo "→ bundling .so deps"
          SKIP="libc.so libm.so libdl.so libz.so libstdc++.so liblog.so libandroid.so libc++.so libgcc_s.so libgcc.so"
          for pkg in $ALL; do
            [ -d "$TMP/pkgs/$pkg" ] || continue
            find "$TMP/pkgs/$pkg" \( -name "*.so" -o -name "*.so.*" \) | while read -r so; do
              name="$(basename "$so")"
              echo " $SKIP " | grep -q " $name " && continue || true
              [ -f "$LIB/$name" ] && continue
              cp "$so" "$LIB/$name"
            done
          done
          echo "  $(ls "$LIB" | wc -l) libs bundled"

          echo "→ bins: $(ls "$BIN")"

      - name: Clone oh-my-zsh + plugins
        run: |
          set -euo pipefail

          OMZ="files/oh-my-zsh"

          git clone --depth=1 \
            https://github.com/ohmyzsh/ohmyzsh.git \
            "$OMZ"

          git clone --depth=1 \
            https://github.com/romkatv/powerlevel10k.git \
            "$OMZ/custom/themes/powerlevel10k"

          git clone --depth=1 \
            https://github.com/zsh-users/zsh-autosuggestions \
            "$OMZ/custom/plugins/zsh-autosuggestions"

          git clone --depth=1 \
            https://github.com/zsh-users/zsh-syntax-highlighting \
            "$OMZ/custom/plugins/zsh-syntax-highlighting"

          git clone --depth=1 \
            https://github.com/agkozak/zsh-z \
            "$OMZ/custom/plugins/z"

          echo "→ building gitstatusd"

          cd "$OMZ/custom/themes/powerlevel10k/gitstatus"

          ./build -w -s

          echo "→ verifying gitstatusd"

          file usrbin/gitstatusd

          readelf -l usrbin/gitstatusd | grep -E \
            'Requesting program interpreter|INTERP' || true

          ldd usrbin/gitstatusd || true

          test -x usrbin/gitstatusd || {
            echo "ERROR: gitstatusd was not built"
            exit 1
          }

          echo "✓ gitstatusd:"
          file usrbin/gitstatusd

          echo "→ returning to repository root"
          cd "$GITHUB_WORKSPACE"

          find "$OMZ" -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Package
        id: package
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.tag }}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$(date +%Y%m%d)/" module.prop
          zip -r rexshell.zip META-INF module.prop customize.sh service.sh uninstall.sh files system \
            --exclude "*.git*" "*.github*" "*.zwc"
          echo "size=$(du -sh rexshell.zip | cut -f1)" >> "$GITHUB_OUTPUT"
          unzip -l rexshell.zip | awk '
            /files\/bin\//     { bins++ }
            /files\/lib\//     { libs++ }
            /files\/oh-my-zsh/ { omz++ }
            END { printf "bins=%d libs=%d omz=%d\n", bins, libs, omz }
          '

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: rexshell ${{ steps.version.outputs.tag }} (${{ steps.package.outputs.size }})
          make_latest: true
          body: |
            Commit: ${{ github.sha }}

            **One-liner install (from root shell):**
            ```
            curl -Lo /tmp/rexshell.zip https://github.com/mariayuno/resh-magisk/releases/latest/download/rexshell.zip && /data/adb/ksud module install /tmp/rexshell.zip
            ```
          files: rexshell.zip
          token: ${{ secrets.GITHUB_TOKEN }}
